<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bepy | Laboratorio de Datos (Costa Atlántica)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #0f172a; --panel: #1e293b; --text: #f8fafc; --primary: #38bdf8; --success: #10b981; --warning: #f59e0b; --danger: #ef4444; }
        body { font-family: 'Courier New', Courier, monospace; background-color: var(--bg); color: var(--text); padding: 20px; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: var(--primary); margin: 0; font-size: 2.5rem; text-transform: uppercase; letter-spacing: 2px; }
        .header p { color: #94a3b8; font-size: 0.9rem; margin-top: 5px; }

        .sandbox-container { display: flex; gap: 20px; width: 100%; max-width: 1200px; height: 75vh; }
        
        /* Panel de Controles */
        .controls { flex: 1; background: var(--panel); padding: 25px; border-radius: 12px; border: 1px solid #334155; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
        .controls h3 { margin-top: 0; border-bottom: 1px dashed #475569; padding-bottom: 10px; color: var(--warning); display: flex; align-items: center; gap: 10px; }
        
        .control-row { display: flex; gap: 10px; align-items: center; }
        .input-cant { width: 60px; background: #0f172a; border: 1px solid #475569; color: white; padding: 10px; border-radius: 8px; font-family: inherit; font-size: 1rem; text-align: center; }
        
        .btn-seed { flex-grow: 1; background: #334155; color: var(--text); border: 1px solid #475569; padding: 12px 15px; border-radius: 8px; font-family: inherit; font-size: 0.9rem; font-weight: bold; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 10px; text-align: left; }
        .btn-seed:hover { background: var(--primary); color: #0f172a; border-color: var(--primary); }
        .btn-seed i { font-size: 1.2rem; width: 25px; text-align: center; }

        /* Consola de Salida */
        .terminal { flex: 2; background: #000; padding: 20px; border-radius: 12px; border: 1px solid #334155; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); overflow-y: auto; display: flex; flex-direction: column; }
        .terminal-header { border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .terminal-header span { color: #64748b; font-size: 0.8rem; text-transform: uppercase; }
        .log-line { margin: 2px 0; font-size: 0.9rem; line-height: 1.4; }
        .log-success { color: var(--success); }
        .log-info { color: var(--primary); }
        .log-warn { color: var(--warning); }
        .log-error { color: var(--danger); }
        .log-system { color: #94a3b8; }
        
        #btn-limpiar-terminal { background: transparent; color: #64748b; border: 1px solid #64748b; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-family: inherit; font-size: 0.7rem; }
        #btn-limpiar-terminal:hover { background: #64748b; color: #000; }
    </style>
</head>
<body>

    <div class="header">
        <h1><i class="fa-solid fa-flask-vial"></i> Bepy Sandbox</h1>
        <p>Entorno de Pruebas • Focalizado en la Costa Atlántica</p>
    </div>

    <div class="sandbox-container">
        <!-- CONTROLES CON CONTADORES -->
        <div class="controls">
            <h3><i class="fa-solid fa-users"></i> Dueños y Mascotas</h3>
            <div class="control-row">
                <input type="number" id="cant-usuarios" class="input-cant" value="1" min="1" max="50">
                <button class="btn-seed" id="btn-seed-usuarios"><i class="fa-solid fa-user-plus"></i> Generar Usuarios</button>
            </div>
            
            <h3 style="margin-top: 15px;"><i class="fa-solid fa-store"></i> Red Comercial</h3>
            <div class="control-row">
                <input type="number" id="cant-comercios" class="input-cant" value="1" min="1" max="20">
                <button class="btn-seed" id="btn-seed-comercios"><i class="fa-solid fa-shop"></i> Generar Comercios/Vetes</button>
            </div>
            
            <h3 style="margin-top: 15px;"><i class="fa-solid fa-heart" style="color:#f472b6;"></i> Adopciones</h3>
            <div class="control-row">
                <input type="number" id="cant-adopciones" class="input-cant" value="1" min="1" max="20">
                <button class="btn-seed" id="btn-seed-adopciones"><i class="fa-solid fa-paw"></i> Publicar Mascotas</button>
            </div>
            
            <h3 style="margin-top: 15px;"><i class="fa-solid fa-triangle-exclamation" style="color:var(--danger);"></i> Emergencias</h3>
            <div class="control-row">
                <input type="number" id="cant-sos" class="input-cant" value="1" min="1" max="5">
                <button class="btn-seed" id="btn-seed-sos" style="border-color: var(--danger);"><i class="fa-solid fa-satellite-dish" style="color:var(--danger);"></i> Simular Alertas S.O.S</button>
            </div>
            
            <h3 style="margin-top: 15px; color:var(--primary);"><i class="fa-solid fa-rocket"></i> Inyección Controlada</h3>
            <button class="btn-seed" id="btn-seed-masivo" style="width: 100%; justify-content: center; background: var(--primary); color: var(--bg);"><i class="fa-solid fa-bolt"></i> Inyectar Exactamente 5 de Todo</button>
        </div>

        <!-- TERMINAL DE LOGS -->
        <div class="terminal">
            <div class="terminal-header">
                <span><i class="fa-solid fa-terminal"></i> Terminal_Bepy_Costa_v2.1</span>
                <button id="btn-limpiar-terminal">Limpiar</button>
            </div>
            <div id="pantalla-terminal" style="flex-grow: 1; overflow-y: auto;">
                <div class="log-line log-system">Bepy Sandbox Inicializado. Operando solo en Costa Atlántica...</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, setDoc, getDocs, updateDoc, query, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyBoTDAAebxyRcg0-qneHllYHC7IE-wI68Y", authDomain: "bepy-salud-mascota.firebaseapp.com", projectId: "bepy-salud-mascota" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app, "bepy-data");

        const terminal = document.getElementById('pantalla-terminal');
        function log(mensaje, tipo = 'info') {
            const hora = new Date().toLocaleTimeString('es-AR');
            const div = document.createElement('div');
            div.className = `log-line log-${tipo}`; div.innerHTML = `[${hora}] > ${mensaje}`;
            terminal.appendChild(div); terminal.scrollTop = terminal.scrollHeight;
        }
        document.getElementById('btn-limpiar-terminal').addEventListener('click', () => terminal.innerHTML = '');

        const ubicacionesCosta = [
            { nombre: "Mar Azul", lat: -37.3333, lng: -57.0333 },
            { nombre: "Mar de las Pampas", lat: -37.3236, lng: -57.0125 },
            { nombre: "Santa Teresita", lat: -36.5414, lng: -56.7214 },
            { nombre: "Mar del Tuyú", lat: -36.5744, lng: -56.6917 },
            { nombre: "San Bernardo", lat: -36.6833, lng: -56.6833 },
            { nombre: "Pinamar", lat: -37.1097, lng: -56.8614 }
        ];

        const nombresPersonas = ["Martina", "Lucas", "Camila", "Joaquín", "Sofía", "Mateo", "Valentina", "Facundo"];
        const apellidos = ["García", "Rodríguez", "López", "Fernández", "González", "Pérez"];
        const nombresPerros = ["Simón", "Milo", "Coco", "Rocco", "Toby", "Luna", "Nala"];
        const comercios = ["PetShop El Ancla", "Veterinaria Costa Vet", "Peluquería Playa", "Refugio Mar", "Alimentos La Costa", "Clínica del Tuyú", "Paseos San Bernardo"];

        const random = (arr) => arr[Math.floor(Math.random() * arr.length)];
        const randomNum = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
        const generarIdUnico = () => "UID-" + Math.random().toString(36).substring(2, 12).toUpperCase();

        // 1. GENERAR USUARIOS
        async function seedUsuarios(cantidad) {
            log(`Generando ${cantidad} usuarios costeros...`, 'warn');
            for (let i = 0; i < cantidad; i++) {
                const nombre = random(nombresPersonas); const apellido = random(apellidos);
                const locData = random(ubicacionesCosta);
                const latVariacion = locData.lat + (Math.random() - 0.5) * 0.01;
                const lngVariacion = locData.lng + (Math.random() - 0.5) * 0.01;
                const uid = generarIdUnico();

                try {
                    await setDoc(doc(db, "usuarios", uid), {
                        email: `${nombre.toLowerCase()}${randomNum(1,99)}@costa.com`, 
                        nombre: `${nombre} ${apellido}`, rol: "usuario", 
                        localidad: locData.nombre, lat: latVariacion, lng: lngVariacion, 
                        plan: "gratis", fecha_registro: new Date()
                    });
                    
                    await addDoc(collection(db, "mascotas"), {
                        dueño_uid: uid, nombre: random(nombresPerros), especie: "perro", raza: "Mestizo", 
                        edad: randomNum(1, 12), codigo_bepy: "BEPY-" + randomNum(1000,9999), estado_sos: false
                    });
                    log(`Usuario en ${locData.nombre} creado.`, 'success');
                } catch (e) { log(`Error: ${e.message}`, 'error'); }
            }
        }

        // 2. GENERAR COMERCIOS (¡CORREGIDO!)
        async function seedComercios(cantidad) {
            log(`Generando ${cantidad} comercios/veterinarias costeros...`, 'warn');
            for (let i = 0; i < cantidad; i++) {
                const nombreComercio = random(comercios) + " " + randomNum(1,10);
                
                // Lógica de separación corregida
                const esVeterinaria = nombreComercio.includes("Vet") || nombreComercio.includes("Clínica");
                const rolAsignado = esVeterinaria ? "profesional" : "prestador";
                const rubroAsignado = esVeterinaria ? "veterinaria" : random(["petshop", "paseador", "guarderia"]);
                const prefijoEmail = esVeterinaria ? "vet" : "comercio";

                const locData = random(ubicacionesCosta);
                const latVariacion = locData.lat + (Math.random() - 0.5) * 0.01;
                const lngVariacion = locData.lng + (Math.random() - 0.5) * 0.01;
                const uid = generarIdUnico();

                try {
                    // Guardamos en la base de usuarios principal con el ROL CORRECTO
                    await setDoc(doc(db, "usuarios", uid), { 
                        email: `${prefijoEmail}@${nombreComercio.replace(/\s+/g, '').toLowerCase()}.com`, 
                        rol: rolAsignado, localidad: locData.nombre, 
                        lat: latVariacion, lng: lngVariacion 
                    });

                    // Guardamos en la colección que corresponde (profesionales o prestadores)
                    const coleccionDestino = esVeterinaria ? "profesionales" : "prestadores";
                    await setDoc(doc(db, coleccionDestino, uid), { 
                        email: `${prefijoEmail}@${nombreComercio.replace(/\s+/g, '').toLowerCase()}.com`, 
                        nombre_comercio: nombreComercio, tipo: rubroAsignado, localidad: locData.nombre 
                    });

                    log(`${rolAsignado.toUpperCase()} ${nombreComercio} en ${locData.nombre} creado.`, 'success');
                } catch (e) { log(`Error: ${e.message}`, 'error'); }
            }
        }

        // 3. GENERAR ADOPCIONES
        async function seedAdopciones(cantidad) {
            log(`Publicando ${cantidad} adopciones...`, 'warn');
            for (let i = 0; i < cantidad; i++) {
                try {
                    await addDoc(collection(db, "adopciones"), {
                        mascota_nombre: random(nombresPerros), refugio_nombre: "Refugio " + random(ubicacionesCosta).nombre, 
                        estado: "disponible", fecha_publicacion: new Date().toISOString()
                    });
                    log(`Adopción publicada con éxito.`, 'success');
                } catch (e) { log(`Error: ${e.message}`, 'error'); }
            }
        }

        // 4. SIMULAR S.O.S
        async function simularSOS(cantidad) {
            log(`Activando ${cantidad} Alertas S.O.S...`, 'warn');
            try {
                const snapshot = await getDocs(query(collection(db, "mascotas"), limit(20)));
                if(snapshot.empty) { log("No hay mascotas para perder. Generá usuarios.", "error"); return; }
                
                let afectadas = 0;
                for (let i = 0; i < snapshot.docs.length && afectadas < cantidad; i++) {
                    const docMascota = snapshot.docs[i];
                    if (!docMascota.data().estado_sos) {
                        const locData = random(ubicacionesCosta);
                        await updateDoc(doc(db, "mascotas", docMascota.id), { estado_sos: true });
                        await addDoc(collection(db, "alertas_sos"), { 
                            mascota_id: docMascota.id, mascota_nombre: docMascota.data().nombre,
                            ubicacion: locData.nombre, lat: locData.lat, lng: locData.lng, 
                            fecha_activacion: new Date(), estado: "Activa" 
                        });
                        log(`¡S.O.S! ${docMascota.data().nombre} reportado en ${locData.nombre}`, 'error');
                        afectadas++;
                    }
                }
            } catch (e) { log(`Error SOS: ${e.message}`, 'error'); }
        }

        // ASIGNACIÓN DE BOTONES LEYENDO LOS INPUTS
        document.getElementById('btn-seed-usuarios').addEventListener('click', () => seedUsuarios(parseInt(document.getElementById('cant-usuarios').value)));
        document.getElementById('btn-seed-comercios').addEventListener('click', () => seedComercios(parseInt(document.getElementById('cant-comercios').value)));
        document.getElementById('btn-seed-adopciones').addEventListener('click', () => seedAdopciones(parseInt(document.getElementById('cant-adopciones').value)));
        document.getElementById('btn-seed-sos').addEventListener('click', () => simularSOS(parseInt(document.getElementById('cant-sos').value)));
        
        // BOTÓN 5 EXACTOS
        document.getElementById('btn-seed-masivo').addEventListener('click', async () => {
            log("--- INYECTANDO EXACTAMENTE 5 DE CADA UNO ---", "warn");
            await seedUsuarios(5); await seedComercios(5); await seedAdopciones(5); await simularSOS(5);
            log("--- PROCESO FINALIZADO ---", "success");
        });
    </script>
</body>
</html>
