<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bepy | Acceso al Ecosistema</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { 
            --primary: #0ea5e9; /* Azul Bepy */
            --dark: #0f172a; 
            --panel: #1e293b; 
            --text: #f8fafc; 
            --bg-light: #f1f5f9;
            --success: #10b981; 
            --danger: #ef4444; 
            --gold: #f59e0b;
        }
        
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: linear-gradient(135deg, var(--bg-light) 0%, #cbd5e1 100%);
            color: var(--dark); 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
        }

        .auth-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
            box-sizing: border-box;
        }

        .auth-card {
            background: white;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        /* Diseño del logo */
        .logo-box {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo-box i {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 10px;
        }
        .logo-box h1 {
            margin: 0;
            font-size: 2rem;
            color: var(--dark);
            letter-spacing: -1px;
        }
        .logo-box p {
            margin: 5px 0 0 0;
            color: #64748b;
            font-size: 0.95rem;
        }

        /* Pestañas (Login / Registro) */
        .tabs {
            display: flex;
            background: #f8fafc;
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 25px;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: #64748b;
            transition: 0.3s;
        }
        .tab-btn.active {
            background: white;
            color: var(--primary);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        /* Formularios */
        .form-section {
            display: none;
            animation: fadeIn 0.4s ease;
        }
        .form-section.active {
            display: block;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            color: #475569;
            text-transform: uppercase;
        }
        .input-form {
            width: 100%;
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: 0.2s;
            color: var(--dark);
        }
        .input-form:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.1);
        }

        /* Campos condicionales */
        .conditional-fields {
            background: #f8fafc;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 1px dashed #cbd5e1;
            display: none;
        }

        /* Botón de acción */
        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background: #0284c7;
            transform: translateY(-2px);
        }
        .btn-submit:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        .msj-error {
            color: var(--danger);
            text-align: center;
            font-size: 0.9rem;
            margin-top: 15px;
            font-weight: bold;
            min-height: 20px;
        }
        
        .loader-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            display: none;
        }
        .loader-overlay i {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="auth-card">
        
        <div class="loader-overlay" id="global-loader">
            <i class="fa-solid fa-circle-notch fa-spin"></i>
            <strong style="color: var(--dark);">Conectando ecosistema...</strong>
        </div>

        <div class="logo-box">
            <i class="fa-solid fa-paw"></i>
            <h1>Bepy</h1>
            <p>El Ecosistema Global de Bienestar Animal</p>
        </div>

        <div class="tabs">
            <div class="tab-btn active" onclick="switchTab('login')">Ingresar</div>
            <div class="tab-btn" onclick="switchTab('register')">Crear Cuenta</div>
        </div>

        <!-- FORMULARIO DE LOGIN -->
        <div id="form-login" class="form-section active">
            <div class="input-group">
                <label>Correo Electrónico</label>
                <input type="email" id="login-email" class="input-form" placeholder="tu@email.com">
            </div>
            <div class="input-group">
                <label>Contraseña</label>
                <input type="password" id="login-pass" class="input-form" placeholder="••••••••">
            </div>
            <button id="btn-login" class="btn-submit">Ingresar al Panel</button>
            <div id="msj-login" class="msj-error"></div>
        </div>

        <!-- FORMULARIO DE REGISTRO MAESTRO -->
        <div id="form-register" class="form-section">
            <div class="input-group">
                <label>Correo Electrónico</label>
                <input type="email" id="reg-email" class="input-form" placeholder="tu@email.com">
            </div>
            <div class="input-group">
                <label>Contraseña (Mínimo 6 caracteres)</label>
                <input type="password" id="reg-pass" class="input-form" placeholder="••••••••">
            </div>

            <div class="input-group">
                <label>Localidad / Ciudad (Obligatorio)</label>
                <input type="text" id="reg-localidad" class="input-form" placeholder="Ej: La Plata, City Bell...">
            </div>

            <div class="input-group">
                <label>Tipo de Cuenta</label>
                <select id="reg-rol" class="input-form" onchange="toggleCampos()">
                    <option value="usuario">Dueño de Mascota</option>
                    <option value="profesional">Profesional Veterinario</option>
                    <option value="prestador">Comercio / Prestador de Servicios</option>
                </select>
            </div>

            <!-- Campos dinámicos para Veterinarios -->
            <div id="campos-profesional" class="conditional-fields">
                <div class="input-group">
                    <label>Nombre de la Veterinaria o Consultorio</label>
                    <input type="text" id="reg-prof-nombre" class="input-form" placeholder="Ej: Veterinaria San Roque">
                </div>
                <div class="input-group">
                    <label>Matrícula Nacional/Provincial</label>
                    <input type="text" id="reg-prof-matricula" class="input-form" placeholder="Ej: MP-12345">
                </div>
            </div>

            <!-- Campos dinámicos para Comercios/Refugios -->
            <div id="campos-prestador" class="conditional-fields">
                <div class="input-group">
                    <label>Nombre del Comercio o Refugio</label>
                    <input type="text" id="reg-prest-nombre" class="input-form" placeholder="Ej: PetShop Firulais">
                </div>
                <div class="input-group">
                    <label>Categoría</label>
                    <select id="reg-prest-tipo" class="input-form">
                        <option value="petshop">Pet Shop</option>
                        <option value="paseador">Paseador / Adiestrador</option>
                        <option value="guarderia">Guardería / Hotel Canino</option>
                        <option value="refugio">Refugio de Adopción</option>
                    </select>
                </div>
            </div>

            <button id="btn-register" class="btn-submit">Registrarme en Bepy</button>
            <div id="msj-register" class="msj-error"></div>
        </div>

    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = { apiKey: "AIzaSyBoTDAAebxyRcg0-qneHllYHC7IE-wI68Y", authDomain: "bepy-salud-mascota.firebaseapp.com", projectId: "bepy-salud-mascota" };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // ==========================================
    // UI: MANEJO DE PESTAÑAS Y CAMPOS DINÁMICOS
    // ==========================================
    window.switchTab = function(tab) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.form-section').forEach(form => form.classList.remove('active'));
        
        if (tab === 'login') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('form-login').classList.add('active');
        } else {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('form-register').classList.add('active');
        }
    };

    window.toggleCampos = function() {
        const rol = document.getElementById('reg-rol').value;
        document.getElementById('campos-profesional').style.display = (rol === 'profesional') ? 'block' : 'none';
        document.getElementById('campos-prestador').style.display = (rol === 'prestador') ? 'block' : 'none';
    };

    function mostrarLoader(mostrar) {
        document.getElementById('global-loader').style.display = mostrar ? 'flex' : 'none';
    }

    // ==========================================
    // LÓGICA DE INICIO DE SESIÓN (LOGIN INTELIGENTE)
    // ==========================================
    document.getElementById('btn-login').addEventListener('click', async () => {
        const email = document.getElementById('login-email').value.trim();
        const pass = document.getElementById('login-pass').value.trim();
        const msj = document.getElementById('msj-login');

        if (!email || !pass) { msj.innerText = "Completá todos los campos."; return; }
        
        msj.innerText = "";
        mostrarLoader(true);

        try {
            const userCredential = await signInWithEmailAndPassword(auth, email, pass);
            const uid = userCredential.user.uid;

            // Consultar en la base de datos qué rol tiene este usuario
            const docRef = doc(db, "usuarios", uid);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                const data = docSnap.data();
                const rolUsuario = data.rol;

                // REDIRECCIÓN INTELIGENTE
                if (rolUsuario === 'admin') {
                    window.location.href = "admin-panel.html";
                } else if (rolUsuario === 'profesional') {
                    window.location.href = "panel-profesional.html";
                } else if (rolUsuario === 'prestador') {
                    window.location.href = "panel-prestador.html";
                } else {
                    window.location.href = "panel-usuario.html"; // Por defecto, rol usuario
                }
            } else {
                // Si por algún error no está en la BD, lo mandamos al de usuario
                window.location.href = "panel-usuario.html"; 
            }

        } catch (error) {
            mostrarLoader(false);
            console.error(error);
            if (error.code === 'auth/invalid-credential') {
                msj.innerText = "Credenciales incorrectas.";
            } else {
                msj.innerText = "Error al iniciar sesión.";
            }
        }
    });

    // ==========================================
    // LÓGICA DE REGISTRO UNIFICADO Y BLINDADO
    // ==========================================
    document.getElementById('btn-register').addEventListener('click', async () => {
        const email = document.getElementById('reg-email').value.trim();
        const pass = document.getElementById('reg-pass').value.trim();
        const localidad = document.getElementById('reg-localidad').value.trim();
        const rol = document.getElementById('reg-rol').value;
        const msj = document.getElementById('msj-register');

        // Validaciones básicas
        if (!email || !pass || !localidad) { msj.innerText = "Email, Contraseña y Localidad son obligatorios."; return; }
        if (pass.length < 6) { msj.innerText = "La contraseña debe tener al menos 6 caracteres."; return; }
        
        // Validaciones condicionales
        if (rol === 'profesional' && !document.getElementById('reg-prof-matricula').value.trim()) {
            msj.innerText = "La matrícula es obligatoria para profesionales."; return;
        }
        if (rol === 'prestador' && !document.getElementById('reg-prest-nombre').value.trim()) {
            msj.innerText = "El nombre del comercio es obligatorio."; return;
        }

        msj.innerText = "";
        mostrarLoader(true);

        try {
            // 1. Crear el usuario en Firebase Auth
            const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
            const uid = userCredential.user.uid;

            // 2. Guardar en la colección MAESTRA "usuarios" (El blindaje)
            await setDoc(doc(db, "usuarios", uid), {
                email: email,
                rol: rol,
                localidad: localidad,
                plan: "gratis", // Todos arrancan gratis
                fecha_registro: new Date().toISOString()
            });

            // 3. Si es Profesional, guardamos sus datos específicos en su colección
            if (rol === 'profesional') {
                await setDoc(doc(db, "profesionales", uid), {
                    email: email,
                    nombre_veterinaria: document.getElementById('reg-prof-nombre').value.trim(),
                    matricula: document.getElementById('reg-prof-matricula').value.trim(),
                    localidad: localidad
                });
            }

            // 4. Si es Prestador, guardamos sus datos específicos en su colección
            if (rol === 'prestador') {
                await setDoc(doc(db, "prestadores", uid), {
                    email: email,
                    nombre_comercio: document.getElementById('reg-prest-nombre').value.trim(),
                    tipo: document.getElementById('reg-prest-tipo').value,
                    localidad: localidad
                });
            }

            // 5. Redirección inteligente post-registro
            if (rol === 'profesional') window.location.href = "panel-profesional.html";
            else if (rol === 'prestador') window.location.href = "panel-prestador.html";
            else window.location.href = "panel-usuario.html";

        } catch (error) {
            mostrarLoader(false);
            console.error(error);
            if (error.code === 'auth/email-already-in-use') {
                msj.innerText = "Ese correo ya está registrado.";
            } else {
                msj.innerText = "Error al registrar la cuenta.";
            }
        }
    });
</script>
</body>
</html>
