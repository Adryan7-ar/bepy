<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bepy Partner Hub | Profesional</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #f59e0b; --dark: #1e293b; --bg: #f8fafc; --success: #10b981; --med: #6366f1; --danger: #ef4444; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--dark); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* SIDEBAR PROFESIONAL */
        aside { width: 260px; background: var(--dark); color: white; padding: 25px 20px; display: flex; flex-direction: column; box-shadow: 4px 0 15px rgba(0,0,0,0.1); z-index: 10; }
        .logo { font-size: 1.4rem; font-weight: 900; margin-bottom: 40px; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        .nav-link { padding: 14px 16px; cursor: pointer; border-radius: 12px; transition: 0.3s; display: flex; align-items: center; gap: 12px; color: #94a3b8; font-weight: 600; margin-bottom: 8px; }
        .nav-link:hover, .nav-link.active { background: #334155; color: white; }
        .nav-link i { font-size: 1.1rem; width: 20px; text-align: center; }
        
        main { flex: 1; padding: 35px; overflow-y: auto; }
        .section { display: none; animation: fadeIn 0.4s ease; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        /* CARDS Y UI */
        .card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; margin-bottom: 25px; }
        .grid-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .stat-card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; border-left: 5px solid var(--primary); }
        .stat-card h4 { margin: 0 0 8px 0; color: #64748b; font-size: 0.85rem; text-transform: uppercase; }
        .stat-card .numero { font-size: 2.2rem; font-weight: 900; color: var(--dark); margin: 0; }
        
        .input-form { width: 100%; padding: 12px; margin: 8px 0 15px 0; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 0.95rem; box-sizing: border-box; outline: none; }
        .btn-main { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        
        /* MODALES */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 1000; padding: 20px; box-sizing: border-box; }
        .modal-content { background: white; padding: 30px; border-radius: 20px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; position: relative; }
        .btn-cerrar-modal { position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #94a3b8; }
        
        /* BLOG FEED */
        .blog-post { background: white; padding: 20px; border-radius: 12px; border-left: 4px solid var(--primary); margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
    </style>
</head>
<body>

    <aside>
        <div class="logo"><i class="fa-solid fa-store"></i> Bepy Partner Hub</div>
        <div class="nav-link active" onclick="showSection('dashboard', this)"><i class="fa-solid fa-chart-line"></i> Resumen</div>
        <div class="nav-link" onclick="showSection('validar', this)"><i class="fa-solid fa-qrcode"></i> Validar Cliente</div>
        <div class="nav-link" id="nav-adopciones" onclick="showSection('adopciones', this)" style="display:none;"><i class="fa-solid fa-heart"></i> Adopciones</div>
        <div class="nav-link" onclick="showSection('comunidad', this)"><i class="fa-solid fa-comments"></i> Comunidad</div>
        <div class="nav-link" onclick="showSection('promos', this)"><i class="fa-solid fa-tags"></i> Promociones</div>
        <div style="margin-top: auto;">
            <button id="btn-salir" style="width:100%; padding:12px; border:none; background:var(--danger); color:white; border-radius:10px; cursor:pointer; font-weight:bold;"><i class="fa-solid fa-arrow-right-from-bracket"></i> Salir</button>
        </div>
    </aside>

    <main>
        <section id="dashboard" class="section active">
            <h1 id="welcome-title">Cargando perfil...</h1>
            <div class="grid-stats">
                <div class="stat-card"><h4>Canjes este mes</h4><p class="numero" id="stat-canjes">0</p></div>
                <div class="stat-card" style="border-left-color: var(--success);"><h4>Estado</h4><p class="numero" id="stat-role" style="font-size:1.2rem; color:var(--success); margin-top:10px;">--</p></div>
            </div>
        </section>

        <section id="validar" class="section">
            <div class="card">
                <h2><i class="fa-solid fa-qrcode" style="color:var(--primary);"></i> Validar Cliente Premium</h2>
                <input type="text" id="input-codigo" class="input-form" placeholder="CÓDIGO BEPY DEL CLIENTE" style="text-transform:uppercase;">
                <button id="btn-validar" class="btn-main">Validar Beneficio</button>
                <div id="resultado-validacion" style="display:none; margin-top:15px; padding:15px; border-radius:8px;"></div>
            </div>
        </section>

        <section id="adopciones" class="section">
            <div class="card">
                <h2><i class="fa-solid fa-heart" style="color:var(--danger);"></i> Cargar Animal en Adopción</h2>
                <input type="text" id="adop-nombre" class="input-form" placeholder="Nombre">
                <textarea id="adop-desc" class="input-form" placeholder="Historia..."></textarea>
                <button id="btn-post-adop" class="btn-main" style="background:var(--success);">Publicar Adopción</button>
            </div>
        </section>

        <section id="comunidad" class="section">
            <h1>Comunidad Bepy</h1>
            <div class="card">
                <textarea id="blog-input" class="input-form" placeholder="¿Qué novedad querés compartir con otros colegas?"></textarea>
                <button id="btn-postear" class="btn-main">Publicar en el Muro</button>
            </div>
            <div id="muro-comunidad"></div>
        </section>

        <section id="promos" class="section">
            <h1>Gestión de Promos</h1>
            <div class="card">
                <input type="text" id="promo-titulo" class="input-form" placeholder="Título de la Promo">
                <input type="text" id="promo-descuento" class="input-form" placeholder="Descuento (Ej: 20% OFF)">
                <button id="btn-guardar-promo" class="btn-main">Activar Promoción</button>
            </div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs, addDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-lite.js";

        const db = getFirestore(initializeApp({ apiKey: "AIzaSyBoTDAAebxyRcg0-qneHllYHC7IE-wI68Y", authDomain: "bepy-salud-mascota.firebaseapp.com", projectId: "bepy-salud-mascota" }));
        
        let comercioActual = null; let totalCanjes = 0;

        onAuthStateChanged(getAuth(), async (user) => {
            if (!user) window.location.href = "index.html";
            else {
                comercioActual = user;
                const snap = await getDoc(doc(db, "prestadores", user.uid));
                if(snap.exists()){
                    const data = snap.data();
                    document.getElementById('welcome-title').innerText = `Hola, ${data.nombre_comercio}`;
                    document.getElementById('stat-role').innerText = data.role.toUpperCase();
                    if(data.role === 'refugio') document.getElementById('nav-adopciones').style.display = 'flex';
                }
                cargarBlog(); cargarPromociones();
            }
        });

        window.showSection = (id, el) => {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active'); el.classList.add('active');
        };

        // VALIDADOR (Lógica preservada)
        document.getElementById('btn-validar').addEventListener('click', async () => {
            const codigo = document.getElementById('input-codigo').value.trim().toUpperCase();
            const resDiv = document.getElementById('resultado-validacion');
            const q = query(collection(db, "mascotas"), where("codigo_bepy", "==", codigo));
            const consulta = await getDocs(q);
            
            resDiv.style.display = 'block';
            if(!consulta.empty) {
                totalCanjes++; document.getElementById('stat-canjes').innerText = totalCanjes;
                resDiv.style.background = "#f0fdf4"; resDiv.innerHTML = "¡Cliente Validado con Éxito!";
            } else {
                resDiv.style.background = "#fef2f2"; resDiv.innerHTML = "Código inválido.";
            }
        });

        // BLOG
        document.getElementById('btn-postear').addEventListener('click', async () => {
            const contenido = document.getElementById('blog-input').value;
            await addDoc(collection(db, "novedades_veterinarias"), { contenido, autor: comercioActual.email, fecha: new Date().toISOString() });
            cargarBlog();
        });

        async function cargarBlog() {
            const cont = document.getElementById('muro-comunidad'); cont.innerHTML = "";
            const res = await getDocs(collection(db, "novedades_veterinarias"));
            res.forEach(d => { const p = d.data(); cont.innerHTML += `<div class="blog-post">${p.contenido}</div>`; });
        }

        async function cargarPromociones() { /* Lógica anterior de promos */ }
    </script>
</body>
</html>
